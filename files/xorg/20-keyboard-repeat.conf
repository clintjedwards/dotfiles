# Key repeat: 175ms before repeating starts, then 20 repeats per second.
#
# This lives in Xorg config rather than an `xset r rate` at login because X
# resets the rate whenever a keyboard is plugged in, and this applies to every
# keyboard as it shows up. Linked into /etc/X11/xorg.conf.d by install.sh.
Section "InputClass"
    Identifier "keyboard-repeat"
    MatchIsKeyboard "on"
    Option "AutoRepeat" "175 20"
EndSection
