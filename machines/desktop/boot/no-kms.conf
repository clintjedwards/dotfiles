# The kms hook adds nouveau and about 107M of its firmware to every initramfs.
# nvidia-utils blacklists nouveau, so it's never loaded, and it makes each image
# nine times bigger on a 512M /boot.
#
# This removes the one hook rather than setting HOOKS, so whatever the installer
# picked for the disks (mdadm_udev, encrypt, etc.) stays.
for i in "${!HOOKS[@]}"; do
    if [ "${HOOKS[i]}" = kms ]; then
        unset 'HOOKS[i]'
    fi
done
