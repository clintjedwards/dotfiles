# If a RAID drive is missing at power-on, mdadm waits for it, and what ends the
# wait is a systemd timer. The busybox hooks have nothing to run it, so they give
# up and drop to a rescue shell. The systemd hooks start the array after 30s.
#
# The rescue shell is locked by default here. To get one, press e on the boot menu
# entry and add systemd.setenv=SYSTEMD_SULOGIN_FORCE=1 to the options.
#
# Like no-kms.conf, this only swaps the hooks it has to.
for i in "${!HOOKS[@]}"; do
    case "${HOOKS[i]}" in
        udev) HOOKS[i]=systemd ;;
        keymap) HOOKS[i]=sd-vconsole ;;
        consolefont) unset 'HOOKS[i]' ;;
    esac
done
