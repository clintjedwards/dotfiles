# Desktop-only i3 settings, included at the end of i3/config.

# Toggle office lights (a key on the mini keyboard)
bindsym XF86Launch7 exec --no-startup-id ~/.bin/toggle-office-lights

# Sometimes the monitor wont start, give it a kick.
bindsym $mod+F8 exec xrandr --auto

# No idle blanking at all. DPMS stays off so the monitor never powers down;
# it doesn't always come back.
exec --no-startup-id xset s off -dpms

# correct displays (makes it so docked position starts correctly)
exec_always --no-startup-id autorandr -c
