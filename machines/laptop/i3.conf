# Laptop-only i3 settings, included at the end of i3/config.

# Backlight keys. brightnessctl goes through logind, so it needs no udev rules
# or group. -n keeps it from going all the way to black.
bindsym XF86MonBrightnessUp exec --no-startup-id brightnessctl -q set 5%+
bindsym XF86MonBrightnessDown exec --no-startup-id brightnessctl -q -n set 5%-

# Turn the screen off after 10 minutes idle to save battery, without locking.
# The screensaver stays off because xss-lock would turn it into a lock, and
# the idle timer doesn't see videos or calls. Closing the lid still suspends,
# and that locks.
exec --no-startup-id xset s off dpms 600 600 600
