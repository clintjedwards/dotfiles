# No tap to click, and clickfinger instead of button areas: one finger is a
# left click, two is right, three is middle, anywhere on the pad. Linked into
# /etc/X11/xorg.conf.d by install.sh.
Section "InputClass"
    Identifier "touchpad"
    MatchIsTouchpad "on"
    Driver "libinput"
    Option "Tapping" "off"
    Option "ClickMethod" "clickfinger"
EndSection
