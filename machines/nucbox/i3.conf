# Nucbox-only i3 settings, included at the end of i3/config.

# Pick up whatever monitors are plugged in.
exec_always --no-startup-id xrandr --auto

# No idle lock or blanking. With the screensaver off xss-lock has nothing to
# lock on, and with DPMS off the monitor never powers down.
exec --no-startup-id xset s off -dpms
